<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Habbo Hotel 2D & Screen Share</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Pixelated / Retro Vibe -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'VT323', monospace;
      background-color: #121826;
      color: #ffffff;
      user-select: none;
      overflow: hidden;
    }
    .pixel-font {
      font-family: 'Press Start 2P', monospace;
    }
    .habbo-box {
      background: linear-gradient(135deg, #2b3345 0%, #1a1f2c 100%);
      border: 3px solid #4a5568;
      box-shadow: inset 2px 2px 0px rgba(255,255,255,0.1), 0 8px 20px rgba(0,0,0,0.6);
      border-radius: 8px;
    }
    .habbo-btn {
      background: linear-gradient(180deg, #48bb78 0%, #2f855a 100%);
      border: 2px solid #22543d;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.3);
      transition: all 0.1s ease;
    }
    .habbo-btn:hover {
      background: linear-gradient(180deg, #38a169 0%, #276749 100%);
      transform: translateY(-1px);
    }
    .habbo-btn:active {
      transform: translateY(1px);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    }
    .habbo-btn-red {
      background: linear-gradient(180deg, #f56565 0%, #c53030 100%);
      border: 2px solid #742a2a;
    }
    .habbo-btn-red:hover {
      background: linear-gradient(180deg, #e53e3e 0%, #9b2c2c 100%);
    }
    .speech-bubble {
      position: absolute;
      background: white;
      color: black;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      pointer-events: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      border: 2px solid #1a202c;
      transform: translate(-50%, -100%);
      white-space: nowrap;
      z-index: 50;
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: white transparent;
      display: block;
      width: 0;
    }
    canvas {
      image-rendering: pixelated;
      cursor: pointer;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1a202c;
    }
    ::-webkit-scrollbar-thumb {
      background: #4a5568;
      border-radius: 3px;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-2 md:p-4 bg-slate-950 text-slate-100">

  <header class="flex justify-between items-center z-20 habbo-box p-3 px-4 mb-2">
    <div class="flex items-center gap-3">
      <div class="bg-yellow-500 text-slate-900 p-2 rounded-lg font-bold flex items-center gap-2 shadow-inner">
        <i data-lucide="hotel" class="w-6 h-6"></i>
        <span class="pixel-font text-xs tracking-wider uppercase">Habbo Hotel Live</span>
      </div>
      <div class="hidden sm:flex items-center gap-2 text-slate-300 text-lg bg-slate-800/60 px-3 py-1 rounded-full border border-slate-700">
        <i data-lucide="users" class="w-4 h-4 text-emerald-400"></i>
        <span id="onlineCount">1 Online</span>
      </div>
    </div>

    <!-- Controls / Status -->
    <div class="flex items-center gap-2">
      <button id="btnShareScreen" onclick="toggleScreenShare()" class="habbo-btn text-white px-3 py-1.5 rounded text-base flex items-center gap-2 font-bold cursor-pointer">
        <i data-lucide="tv" class="w-5 h-5"></i>
        <span id="shareBtnText">Transmitir Tela</span>
      </button>

      <button id="btnExpandTv" onclick="toggleTvModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white p-2 rounded border border-indigo-800 flex items-center justify-center cursor-pointer">
        <i data-lucide="maximize-2" class="w-5 h-5"></i>
      </button>

      <div id="userInfo" class="hidden sm:flex items-center gap-2 bg-slate-800/80 px-3 py-1 rounded border border-slate-700">
        <div id="userAvatarDot" class="w-3 h-3 rounded-full bg-emerald-500"></div>
        <span id="userNameDisplay" class="font-bold text-slate-200">Visitante</span>
      </div>
    </div>
  </header>

  <main class="relative flex-1 w-full h-full habbo-box overflow-hidden flex items-center justify-center">
    <!-- Isometric Canvas -->
    <canvas id="roomCanvas" class="w-full h-full border-none"></canvas>

    <!-- Floating Speech Bubbles Container -->
    <div id="speechContainer" class="absolute inset-0 pointer-events-none"></div>

    <!-- Active Stream Overlay Badge (if TV active) -->
    <div id="tvStreamBadge" class="hidden absolute top-4 left-4 bg-slate-900/90 border border-emerald-500 text-emerald-400 px-3 py-1.5 rounded-full flex items-center gap-2 text-sm font-bold shadow-lg animate-pulse z-10">
      <div class="w-2.5 h-2.5 rounded-full bg-red-500 animate-ping"></div>
      <i data-lucide="radio" class="w-4 h-4"></i>
      <span id="broadcasterName">Alguém está transmitindo!</span>
    </div>
  </main>

  <footer class="z-20 habbo-box p-2 mt-2 flex gap-2 items-center">
    <div class="relative flex-1">
      <input type="text" id="chatInput" placeholder="Digite uma mensagem e aperte Enter..." 
        class="w-full bg-slate-900/80 text-white border border-slate-700 rounded px-4 py-2 pl-10 focus:outline-none focus:border-emerald-500 text-lg tracking-wide placeholder-slate-500"
        onkeydown="handleChatSubmit(event)" />
      <i data-lucide="message-square" class="w-5 h-5 text-slate-400 absolute left-3 top-2.5"></i>
    </div>
    <button onclick="sendChatMessage()" class="habbo-btn text-white px-5 py-2 rounded text-lg font-bold flex items-center gap-2 cursor-pointer">
      <i data-lucide="send" class="w-4 h-4"></i>
      <span>Falar</span>
    </button>
  </footer>

  <div id="tvModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="habbo-box max-w-4xl w-full flex flex-col overflow-hidden border-2 border-slate-600">
      <div class="flex justify-between items-center bg-slate-800 p-3 px-4 border-b border-slate-700">
        <div class="flex items-center gap-2 text-emerald-400 font-bold text-lg">
          <i data-lucide="tv" class="w-5 h-5"></i>
          <span>Transmissão ao Vivo em Tela Cheia</span>
        </div>
        <button onclick="toggleTvModal()" class="text-slate-400 hover:text-white transition">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>
      <div class="bg-black flex-1 min-h-[300px] max-h-[70vh] flex items-center justify-center relative">
        <video id="fullScreenVideo" autoplay playsinline class="w-full h-full object-contain"></video>
        <div id="noStreamPlaceholder" class="text-slate-500 flex flex-col items-center gap-2 p-8">
          <i data-lucide="tv-off" class="w-16 h-16 stroke-1"></i>
          <p class="text-xl">Nenhuma transmissão ao vivo no momento.</p>
        </div>
      </div>
      <div class="p-3 bg-slate-900 flex justify-end">
        <button onclick="toggleTvModal()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-1.5 rounded font-bold">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Hidden HTML Video Element used to feed canvas stream texture -->
  <video id="remoteVideo" autoplay playsinline muted class="hidden"></video>

  <div id="authModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="habbo-box max-w-md w-full p-6 flex flex-col gap-4 text-slate-100">
      <div class="text-center space-y-2">
        <div class="inline-flex p-3 bg-yellow-500/20 text-yellow-400 rounded-full mb-1">
          <i data-lucide="user-check" class="w-8 h-8"></i>
        </div>
        <h2 class="pixel-font text-sm text-yellow-400">Entrar no Habbo Retro</h2>
        <p class="text-slate-400 text-lg">Escolha seu nome de exibição para entrar na sala multiplayer com áudio e vídeo!</p>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-slate-300 text-base mb-1">Nome do Personagem</label>
          <input type="text" id="loginName" placeholder="Ex: Frank_Habbo" value="HabboUser"
            class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white focus:outline-none focus:border-yellow-400 text-lg" />
        </div>
      </div>

      <button onclick="loginUser()" class="habbo-btn w-full py-3 rounded text-xl font-bold text-white mt-2 cursor-pointer shadow-lg">
        Entrar na Sala
      </button>
    </div>
  </div>

  <!-- Firebase Script SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Global variables exposed for app access
    window.appId = typeof __app_id !== 'undefined' ? __app_id : 'habbo-retro-default';
    const firebaseConfig = {
        apiKey: "AIzaSyDTbmvRPwk6tPOa04VWQZYPHFraWbrI_nY",
        authDomain: "betas-6a3d7.firebaseapp.com",
        projectId: "betas-6a3d7",
        storageBucket: "betas-6a3d7.firebasestorage.app",
        messagingSenderId: "523723665689",
        appId: "1:523723665689:web:9f779284e605741eb41588",
        measurementId: "G-QD6CP4XN2M"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.db = db;
    window.auth = auth;

    // WebRTC Peer Connection Config
    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19020' },
        { urls: 'stun:stun1.l.google.com:19020' }
      ]
    };

    let currentUser = null;
    let localStream = null;
    let peerConnections = {}; // Map of peerId -> RTCPeerConnection
    let isBroadcaster = false;

    // Canvas Isometric Engine variables
    const canvas = document.getElementById('roomCanvas');
    const ctx = canvas.getContext('2d');

    const GRID_SIZE = 10;
    const TILE_WIDTH = 64;
    const TILE_HEIGHT = 32;

    let localPlayer = {
      id: null,
      name: 'Visitante',
      x: 4,
      y: 4,
      targetX: 4,
      targetY: 4,
      color: '#3b82f6',
      speech: '',
      speechTimer: null
    };

    let remotePlayers = {};

    window.loginUser = async function() {
      const nameInput = document.getElementById('loginName').value.trim() || 'HabboPlayer';
      localPlayer.name = nameInput;
      
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          // signInWithCustomToken could be called here if token exists
          await signInAnonymously(auth);
        } else {
          await signInAnonymously(auth);
        }
      } catch (e) {
        console.warn("Auth warning:", e);
      }
    };

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        localPlayer.id = user.uid;
        document.getElementById('authModal').classList.add('hidden');
        document.getElementById('userNameDisplay').innerText = localPlayer.name;

        // Assign random vibrant color for avatar
        const colors = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899'];
        localPlayer.color = colors[Math.floor(Math.random() * colors.length)];
        document.getElementById('userAvatarDot').style.backgroundColor = localPlayer.color;

        // Save initial player state to Firestore
        await syncPlayerState();
        
        // Listen to all players in the public collection
        subscribeToPlayers();

        // Listen for WebRTC signals
        subscribeToSignaling();
      }
    });

    async function syncPlayerState() {
      if (!currentUser) return;
      const playerDocRef = doc(db, 'artifacts', window.appId, 'public', 'data', 'players', currentUser.uid);
      await setDoc(playerDocRef, {
        id: currentUser.uid,
        name: localPlayer.name,
        x: localPlayer.x,
        y: localPlayer.y,
        color: localPlayer.color,
        speech: localPlayer.speech || '',
        updatedAt: Date.now()
      }, { merge: true });
    }

    function subscribeToPlayers() {
      const playersColRef = collection(db, 'artifacts', window.appId, 'public', 'data', 'players');
      onSnapshot(playersColRef, (snapshot) => {
        const activeIds = new Set();
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          activeIds.add(docSnap.id);

          if (docSnap.id === currentUser.uid) {
            // Updated locally
          } else {
            // Sync remote players
            if (!remotePlayers[docSnap.id]) {
              remotePlayers[docSnap.id] = { ...data };
            } else {
              // Smoothly transition coordinates if changed
              remotePlayers[docSnap.id].x = data.x;
              remotePlayers[docSnap.id].y = data.y;
              remotePlayers[docSnap.id].name = data.name;
              remotePlayers[docSnap.id].color = data.color;
              remotePlayers[docSnap.id].speech = data.speech;
            }
          }
        });

        // Cleanup left players
        Object.keys(remotePlayers).forEach(id => {
          if (!activeIds.has(id)) {
            delete remotePlayers[id];
          }
        });

        const totalOnline = Object.keys(remotePlayers).length + 1;
        document.getElementById('onlineCount').innerText = `${totalOnline} Online`;
      }, (err) => console.error("Firestore player sync error:", err));
    }

    window.toggleScreenShare = async function() {
      if (!isBroadcaster && !localStream) {
        try {
          // Request Screen Share Stream
          localStream = await navigator.mediaDevices.getDisplayMedia({
            video: { cursor: "always" },
            audio: false
          });

          isBroadcaster = true;
          document.getElementById('shareBtnText').innerText = "Parar Transmissão";
          document.getElementById('btnShareScreen').classList.add('habbo-btn-red');

          // Display locally on hidden video tag
          const video = document.getElementById('remoteVideo');
          video.srcObject = localStream;
          document.getElementById('fullScreenVideo').srcObject = localStream;
          document.getElementById('noStreamPlaceholder').classList.add('hidden');

          // Notify room in Firestore about active broadcaster
          const roomRef = doc(db, 'artifacts', window.appId, 'public', 'data', 'roomState', 'activeStream');
          await setDoc(roomRef, {
            broadcasterId: currentUser.uid,
            broadcasterName: localPlayer.name,
            timestamp: Date.now()
          });

          // Handle when user stops sharing via browser bar
          localStream.getVideoTracks()[0].onended = () => {
            stopScreenShare();
          };

          // Initiate WebRTC peer connections with all remote players
          Object.keys(remotePlayers).forEach(targetPlayerId => {
            createOffer(targetPlayerId);
          });

        } catch (err) {
          console.error("Erro ao compartilhar tela:", err);
        }
      } else {
        stopScreenShare();
      }
    };

    async function stopScreenShare() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      isBroadcaster = false;
      document.getElementById('shareBtnText').innerText = "Transmitir Tela";
      document.getElementById('btnShareScreen').classList.remove('habbo-btn-red');

      // Clear broadcaster info in Firestore
      const roomRef = doc(db, 'artifacts', window.appId, 'public', 'data', 'roomState', 'activeStream');
      await deleteDoc(roomRef).catch(() => {});

      // Close all peer connections
      Object.keys(peerConnections).forEach(id => {
        peerConnections[id].close();
      });
      peerConnections = {};

      const video = document.getElementById('remoteVideo');
      video.srcObject = null;
      document.getElementById('fullScreenVideo').srcObject = null;
      document.getElementById('noStreamPlaceholder').classList.remove('hidden');
    }

    async function createOffer(targetUserId) {
      if (!localStream) return;

      const pc = new RTCPeerConnection(rtcConfig);
      peerConnections[targetUserId] = pc;

      // Add local tracks to PC
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      // Handle ICE candidates
      pc.onicecandidate = (event) => {
        if (event.candidate) {
          addDoc(collection(db, 'artifacts', window.appId, 'public', 'data', 'signaling'), {
            from: currentUser.uid,
            to: targetUserId,
            type: 'candidate',
            candidate: event.candidate.toJSON()
          });
        }
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      // Send SDP Offer to Firestore signaling collection
      await addDoc(collection(db, 'artifacts', window.appId, 'public', 'data', 'signaling'), {
        from: currentUser.uid,
        to: targetUserId,
        type: 'offer',
        sdp: offer.sdp
      });
    }

    function subscribeToSignaling() {
      // Listen for Stream status
      const streamDocRef = doc(db, 'artifacts', window.appId, 'public', 'data', 'roomState', 'activeStream');
      onSnapshot(streamDocRef, (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          document.getElementById('tvStreamBadge').classList.remove('hidden');
          document.getElementById('broadcasterName').innerText = `${data.broadcasterName} está transmitindo!`;
        } else {
          document.getElementById('tvStreamBadge').classList.add('hidden');
          if (!isBroadcaster) {
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('fullScreenVideo').srcObject = null;
            document.getElementById('noStreamPlaceholder').classList.remove('hidden');
          }
        }
      });

      // Listen for incoming WebRTC signaling messages
      const sigColRef = collection(db, 'artifacts', window.appId, 'public', 'data', 'signaling');
      onSnapshot(sigColRef, (snapshot) => {
        snapshot.docChanges().forEach(async (change) => {
          if (change.type === 'added') {
            const data = change.doc.data();

            // Ignore messages not addressed to us
            if (data.to !== currentUser.uid) return;

            const fromId = data.from;

            if (data.type === 'offer') {
              // Received offer from Broadcaster
              const pc = new RTCPeerConnection(rtcConfig);
              peerConnections[fromId] = pc;

              pc.ontrack = (event) => {
                const remoteVid = document.getElementById('remoteVideo');
                remoteVid.srcObject = event.streams[0];
                document.getElementById('fullScreenVideo').srcObject = event.streams[0];
                document.getElementById('noStreamPlaceholder').classList.add('hidden');
              };

              pc.onicecandidate = (event) => {
                if (event.candidate) {
                  addDoc(collection(db, 'artifacts', window.appId, 'public', 'data', 'signaling'), {
                    from: currentUser.uid,
                    to: fromId,
                    type: 'candidate',
                    candidate: event.candidate.toJSON()
                  });
                }
              };

              await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: data.sdp }));
              const answer = await pc.createAnswer();
              await pc.setLocalDescription(answer);

              await addDoc(collection(db, 'artifacts', window.appId, 'public', 'data', 'signaling'), {
                from: currentUser.uid,
                to: fromId,
                type: 'answer',
                sdp: answer.sdp
              });

            } else if (data.type === 'answer' && peerConnections[fromId]) {
              // Broadcaster receives answer
              await peerConnections[fromId].setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: data.sdp }));

            } else if (data.type === 'candidate' && peerConnections[fromId]) {
              // ICE candidate exchange
              try {
                await peerConnections[fromId].addIceCandidate(new RTCIceCandidate(data.candidate));
              } catch (e) {
                console.warn("Error adding ICE Candidate:", e);
              }
            }

            // Cleanup processed signal
            deleteDoc(change.doc.ref).catch(() => {});
          }
        });
      });
    }

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Map isometric coordinates (grid X, Y) to Screen Canvas (px)
    function gridToISO(gx, gy) {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 3;
      const isoX = centerX + (gx - gy) * (TILE_WIDTH / 2);
      const isoY = centerY + (gx + gy) * (TILE_HEIGHT / 2);
      return { x: isoX, y: isoY };
    }

    // Convert Screen Canvas click (px) to Isometric Grid coordinates
    function isoToGrid(screenX, screenY) {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 3;

      const dx = screenX - centerX;
      const dy = screenY - centerY;

      const gx = Math.floor((dx / (TILE_WIDTH / 2) + dy / (TILE_HEIGHT / 2)) / 2);
      const gy = Math.floor((dy / (TILE_HEIGHT / 2) - dx / (TILE_WIDTH / 2)) / 2);

      return { x: gx, y: gy };
    }

    // Main Draw Loop
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Draw Floor Tiles
      for (let x = 0; x < GRID_SIZE; x++) {
        for (let y = 0; y < GRID_SIZE; y++) {
          const pos = gridToISO(x, y);

          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y);
          ctx.lineTo(pos.x + TILE_WIDTH / 2, pos.y + TILE_HEIGHT / 2);
          ctx.lineTo(pos.x, pos.y + TILE_HEIGHT);
          ctx.lineTo(pos.x - TILE_WIDTH / 2, pos.y + TILE_HEIGHT / 2);
          ctx.closePath();

          // Checkerboard tile colors
          ctx.fillStyle = (x + y) % 2 === 0 ? '#2a3447' : '#1e2638';
          ctx.fill();

          ctx.strokeStyle = '#374151';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      // 2. Draw In-Room TV Screen (Mounted on Wall / Corner grid (0, 0))
      const tvPos = gridToISO(0, 0);
      const videoElem = document.getElementById('remoteVideo');

      ctx.save();
      ctx.translate(tvPos.x - 60, tvPos.y - 120);

      // TV Frame Box
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, 120, 80);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.strokeRect(0, 0, 120, 80);

      // Draw active stream or screen glow animation
      if (videoElem.srcObject && videoElem.readyState >= 2) {
        ctx.drawImage(videoElem, 4, 4, 112, 72);
      } else {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(4, 4, 112, 72);

        // Retro animated screen lines
        ctx.fillStyle = '#0284c7';
        ctx.font = '12px VT323';
        ctx.fillText("HABBO TV", 36, 42);
      }
      ctx.restore();

      // 3. Smooth Movement Interpolation for local player
      if (localPlayer.x !== localPlayer.targetX || localPlayer.y !== localPlayer.targetY) {
        localPlayer.x += (localPlayer.targetX - localPlayer.x) * 0.15;
        localPlayer.y += (localPlayer.targetY - localPlayer.y) * 0.15;

        if (Math.abs(localPlayer.x - localPlayer.targetX) < 0.05) localPlayer.x = localPlayer.targetX;
        if (Math.abs(localPlayer.y - localPlayer.targetY) < 0.05) localPlayer.y = localPlayer.targetY;

        syncPlayerState();
      }

      // Collect all avatars (local + remote) and sort by depth (gx + gy)
      const allAvatars = [];
      allAvatars.push({ ...localPlayer, isLocal: true });

      Object.values(remotePlayers).forEach(rp => {
        allAvatars.push({ ...rp, isLocal: false });
      });

      allAvatars.sort((a, b) => (a.x + a.y) - (b.x + b.y));

      // 4. Render Avatars & Speech Bubbles
      const speechContainer = document.getElementById('speechContainer');
      speechContainer.innerHTML = '';

      allAvatars.forEach(avatar => {
        const p = gridToISO(avatar.x, avatar.y);

        // Shadow
        ctx.beginPath();
        ctx.ellipse(p.x, p.y + TILE_HEIGHT / 2, 12, 6, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fill();

        // Body (Habbo Retro Bobble Style)
        ctx.fillStyle = avatar.color || '#3b82f6';
        ctx.fillRect(p.x - 8, p.y - 20, 16, 22);

        // Head
        ctx.beginPath();
        ctx.arc(p.x, p.y - 28, 10, 0, Math.PI * 2);
        ctx.fillStyle = '#fde047'; // Skin tone
        ctx.fill();
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Eyes
        ctx.fillStyle = '#000';
        ctx.fillRect(p.x - 4, p.y - 30, 2, 4);
        ctx.fillRect(p.x + 2, p.y - 30, 2, 4);

        // Name tag below avatar
        ctx.font = 'bold 12px VT323';
        ctx.fillStyle = avatar.isLocal ? '#facc15' : '#ffffff';
        ctx.textAlign = 'center';
        ctx.fillText(avatar.name, p.x, p.y + TILE_HEIGHT + 10);

        // Speech bubble overlay
        if (avatar.speech) {
          const bubble = document.createElement('div');
          bubble.className = 'speech-bubble';
          bubble.innerText = avatar.speech;
          bubble.style.left = `${p.x}px`;
          bubble.style.top = `${p.y - 45}px`;
          speechContainer.appendChild(bubble);
        }
      });

      requestAnimationFrame(render);
    }

    // Handle Floor Click Movement
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      const gridPos = isoToGrid(clickX, clickY);

      // Validate bounds
      if (gridPos.x >= 0 && gridPos.x < GRID_SIZE && gridPos.y >= 0 && gridPos.y < GRID_SIZE) {
        localPlayer.targetX = gridPos.x;
        localPlayer.targetY = gridPos.y;
      }
    });

    window.sendChatMessage = function() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      localPlayer.speech = text;
      input.value = '';

      syncPlayerState();

      if (localPlayer.speechTimer) clearTimeout(localPlayer.speechTimer);
      localPlayer.speechTimer = setTimeout(() => {
        localPlayer.speech = '';
        syncPlayerState();
      }, 5000);
    };

    window.handleChatSubmit = function(e) {
      if (e.key === 'Enter') {
        sendChatMessage();
      }
    };

    window.toggleTvModal = function() {
      const modal = document.getElementById('tvModal');
      modal.classList.toggle('hidden');
    };

    // Initialize Lucide icons and start animation loop
    lucide.createIcons();
    requestAnimationFrame(render);
  </script>
</body>
</html>
