<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Habbo Hotel 2D - Admin Kick</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Ubuntu:wght@400;700&display=swap');
        
        body {
            font-family: 'Ubuntu', sans-serif;
            background-color: #020617;
            color: #ffffff;
            user-select: none;
            overflow: hidden;
        }

        .font-pixel { font-family: 'Press Start 2P', monospace; }

        .habbo-window {
            background: #1e293b;
            border: 3px solid #0f172a;
            box-shadow: inset -2px -2px 0px #0f172a, inset 2px 2px 0px #334155, 0 20px 30px rgba(0,0,0,0.8);
            border-radius: 8px;
        }

        .habbo-header {
            background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
            border-bottom: 2px solid #0f172a;
        }

        .habbo-btn {
            background: linear-gradient(180deg, #eab308 0%, #ca8a04 100%);
            border: 2px solid #854d0e;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -1px 0 rgba(0,0,0,0.4);
            color: #ffffff;
            text-shadow: 1px 1px 0 #000;
            font-weight: bold;
            transition: all 0.1s ease;
        }

        .habbo-btn:hover { background: linear-gradient(180deg, #facc15 0%, #a16207 100%); transform: translateY(-1px); }
        .habbo-btn-blue { background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%); border: 2px solid #075985; }
        .habbo-btn-purple { background: linear-gradient(180deg, #9333ea 0%, #7e22ce 100%); border: 2px solid #581c87; }
        .habbo-btn-red { background: linear-gradient(180deg, #e11d48 0%, #be123c 100%); border: 2px solid #881337; }
    </style>
</head>
<body class="h-screen w-screen relative overflow-hidden bg-slate-950 flex flex-col">

    <!-- TELA DE LOGIN -->
    <div id="authOverlay" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="habbo-window w-full max-w-md p-6 space-y-5 text-center">
            <div>
                <div class="inline-block bg-amber-500 text-slate-950 px-3 py-1.5 rounded font-pixel text-sm font-bold shadow mb-2">
                    HABBO HOTEL 2D
                </div>
                <h2 class="text-xl font-bold text-white">Bem-vindo ao Quarto!</h2>
                <p class="text-xs text-slate-400 mt-1">Entre com sua conta para jogar</p>
            </div>

            <!-- LOGIN COM GOOGLE -->
            <button onclick="handleGoogleLogin()" class="w-full bg-white hover:bg-slate-100 text-slate-900 font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-3 shadow-lg transition-all border border-slate-300">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Entrar com Conta do Google</span>
            </button>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-slate-700"></div>
                <span class="flex-shrink mx-4 text-xs text-slate-500 font-bold uppercase">ou e-mail</span>
                <div class="flex-grow border-t border-slate-700"></div>
            </div>

            <div class="space-y-3 text-left">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">E-mail</label>
                    <input type="email" id="loginEmail" placeholder="seu@email.com" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Senha</label>
                    <input type="password" id="loginPassword" placeholder="******" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Nome no Jogo</label>
                    <input type="text" id="loginCharacterName" placeholder="Ex: Bruno" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="handleLogin()" class="habbo-btn habbo-btn-blue flex-1 py-2.5 rounded text-xs uppercase">Entrar</button>
                <button onclick="handleRegister()" class="habbo-btn flex-1 py-2.5 rounded text-xs uppercase">Criar Conta</button>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 z-20">
        <div class="flex items-center gap-3">
            <div class="bg-amber-500 text-slate-950 px-2 py-1 rounded font-pixel text-xs font-bold shadow">
                HABBO
            </div>
            <span class="text-sm font-bold text-slate-300 hidden sm:inline">Quarto Principal</span>
            <span class="bg-emerald-500/20 text-emerald-400 text-xs px-2 py-0.5 rounded border border-emerald-500/30 flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="onlineCount">0 Online</span>
            </span>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="window.inviteFriends()" class="habbo-btn habbo-btn-blue text-xs px-3 py-1.5 rounded flex items-center gap-1.5">
                <i data-lucide="share-2" class="w-4 h-4"></i>
                <span>Convidar</span>
            </button>
            <button onclick="window.toggleWindow('screenShareModal')" class="habbo-btn habbo-btn-purple text-xs px-3 py-1.5 rounded flex items-center gap-1.5">
                <i data-lucide="tv" class="w-4 h-4"></i>
                <span>Transmitir Tela</span>
            </button>
            <button onclick="handleLogout()" class="bg-rose-900/50 hover:bg-rose-800 border border-rose-700 text-xs px-3 py-1.5 rounded text-rose-200">
                Sair
            </button>
        </div>
    </header>

    <!-- CANVAS DO JOGO -->
    <main class="flex-1 relative w-full h-full overflow-hidden bg-slate-950">
        <canvas id="gameCanvas" class="absolute inset-0 cursor-pointer"></canvas>

        <div id="toastNotification" class="absolute top-4 left-1/2 -translate-x-1/2 bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-lg shadow-xl border-2 border-slate-900 transition-all transform -translate-y-20 opacity-0 z-50 flex items-center gap-2 text-sm pointer-events-none">
            <i data-lucide="info" class="w-5 h-5"></i>
            <span id="toastMessage"></span>
        </div>

        <div id="liveStreamBadge" class="hidden absolute top-4 left-4 bg-rose-600/90 border border-rose-500 text-white text-xs px-3 py-2 rounded-xl shadow-2xl flex items-center gap-3 z-30 font-bold">
            <span class="w-3 h-3 rounded-full bg-white animate-ping"></span>
            <span>TRANSMISSÃO AO VIVO</span>
            <button onclick="window.expandStreamFullScreen()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 px-3 py-1 rounded-lg flex items-center gap-1.5 font-bold shadow-lg transition-transform active:scale-95">
                <i data-lucide="maximize" class="w-4 h-4"></i>
                <span>ASSISTIR EM TELA CHEIA</span>
            </button>
        </div>

        <!-- MENU ADMIN PARA EXPULSAR JOGADOR -->
        <div id="playerContextMenu" class="hidden absolute z-50 habbo-window p-3 space-y-2 w-48 shadow-2xl transform -translate-x-1/2 -translate-y-full">
            <div class="text-xs font-bold text-amber-400 border-b border-slate-700 pb-1 flex justify-between items-center">
                <span id="selectedPlayerName">Jogador</span>
                <button onclick="closeContextMenu()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <button id="kickBtn" onclick="kickSelectedPlayer()" class="habbo-btn habbo-btn-red w-full py-1.5 rounded text-xs flex items-center justify-center gap-1.5">
                <i data-lucide="user-x" class="w-4 h-4"></i>
                <span>Expulsar do Quarto</span>
            </button>
        </div>
    </main>

    <!-- BARRA DE CHAT -->
    <footer class="h-16 bg-slate-900 border-t border-slate-800 flex items-center px-4 gap-3 z-20">
        <div class="relative flex-1 flex items-center">
            <input type="text" id="chatInput" placeholder="Fale algo no quarto... (Pressione Enter)" 
                   class="w-full bg-slate-950 text-slate-100 border-2 border-slate-700 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-amber-500 transition-colors pr-10"
                   onkeydown="if(event.key==='Enter') window.sendChatMessage()">
            <button onclick="window.sendChatMessage()" class="absolute right-2 text-slate-400 hover:text-amber-400 p-1">
                <i data-lucide="send" class="w-5 h-5"></i>
            </button>
        </div>
    </footer>

    <!-- MODAL TRANSMITIR -->
    <div id="screenShareModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="habbo-window w-full max-w-lg overflow-hidden">
            <div class="habbo-header px-4 py-3 flex items-center justify-between">
                <h3 class="font-pixel text-xs text-purple-400">TRANSMITIR NA TV DO QUARTO</h3>
                <button onclick="window.toggleWindow('screenShareModal')" class="text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <p class="text-xs text-slate-300 leading-relaxed">
                    Sua transmissão aparecerá ao vivo na TV do quarto para todos os jogadores.
                </p>
                <button onclick="window.startPCScreenShare()" class="habbo-btn habbo-btn-purple w-full p-4 rounded-xl text-left flex items-center gap-3">
                    <i data-lucide="monitor" class="w-7 h-7 text-purple-200"></i>
                    <div>
                        <div class="text-sm font-bold">Transmitir Meu Jogo / PC</div>
                        <div class="text-xs text-purple-200 opacity-80">Escolha uma janela ou tela cheia</div>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL TELA CHEIA -->
    <div id="fullScreenStreamModal" class="hidden fixed inset-0 bg-black z-50 flex flex-col items-center justify-center">
        <div class="absolute top-0 left-0 right-0 p-4 bg-gradient-to-b from-black/80 to-transparent flex justify-between items-center z-50">
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-rose-500 animate-pulse"></span>
                <span class="font-bold text-sm text-white drop-shadow">TRANSMISSÃO AO VIVO</span>
            </div>
            <button onclick="window.closeFullScreenStream()" class="bg-rose-600 hover:bg-rose-500 text-white font-bold px-5 py-2.5 rounded-xl flex items-center gap-2 text-sm shadow-2xl">
                <i data-lucide="x" class="w-5 h-5"></i>
                <span>Sair da Tela Cheia</span>
            </button>
        </div>
        <div class="w-full h-full flex items-center justify-center p-0">
            <video id="fullScreenVideoElement" class="w-full h-full object-contain bg-black" autoplay playsinline muted></video>
        </div>
    </div>

    <!-- FIREBASE SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        lucide.createIcons();

        // 👑 SEU E-MAIL DE ADMINISTRADOR (SÓ VOCÊ PODERÁ EXPULSAR)
        const ADMIN_EMAIL = "seu_email@gmail.com"; 

        const firebaseConfig = {
            apiKey: "AIzaSyDTbmvRPwk6tPOa04VWQZYPHFraWbrI_nY",
            authDomain: "betas-6a3d7.firebaseapp.com",
            projectId: "betas-6a3d7",
            storageBucket: "betas-6a3d7.firebasestorage.app",
            messagingSenderId: "523723665689",
            appId: "1:523723665689:web:9f779284e605741eb41588",
            measurementId: "G-QD6CP4XN2M"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let players = {};
        let selectedTargetPlayerId = null;

        const GameState = {
            gridSize: 10,
            tileSize: 54,
            streamVideo: null
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('authOverlay').classList.add('hidden');
                initFirestoreMultiplayer(user);
            } else {
                document.getElementById('authOverlay').classList.remove('hidden');
            }
        });

        async function handleGoogleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                await auth.signInWithPopup(provider);
            } catch (err) {
                alert("Erro ao entrar com Google: " + err.message);
            }
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            try {
                await auth.signInWithEmailAndPassword(email, pass);
            } catch (err) {
                alert("Erro no login: " + err.message);
            }
        }

        async function handleRegister() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            const name = document.getElementById('loginCharacterName').value || 'Habbo';
            try {
                const res = await auth.createUserWithEmailAndPassword(email, pass);
                await res.user.updateProfile({ displayName: name });
                location.reload();
            } catch (err) {
                alert("Erro ao criar conta: " + err.message);
            }
        }

        async function handleLogout() {
            if (currentUser) {
                await db.collection('players').doc(currentUser.uid).delete();
                auth.signOut();
            }
        }

        function initFirestoreMultiplayer(user) {
            const playerRef = db.collection('players').doc(user.uid);
            
            const myData = {
                id: user.uid,
                name: user.displayName || document.getElementById('loginCharacterName').value || 'Habbo',
                x: Math.floor(Math.random() * 6) + 2,
                y: Math.floor(Math.random() * 6) + 2,
                color: '#' + Math.floor(Math.random()*16777215).toString(16),
                kicked: false,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            };

            playerRef.set(myData, { merge: true });

            // ESCUTA ESPECÍFICA PARA EXPULSÃO IMEDIATA DO JOGADOR LOGADO
            playerRef.onSnapshot(doc => {
                if (doc.exists && doc.data().kicked === true) {
                    alert("Você foi expulsar do quarto pelo administrador!");
                    db.collection('players').doc(user.uid).delete();
                    auth.signOut();
                    location.reload();
                }
            });

            // ESCUTA TODOS OS JOGADORES NO QUARTO
            db.collection('players').onSnapshot(snapshot => {
                players = {};
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (!data.kicked) {
                        players[doc.id] = {
                            ...data,
                            x: typeof data.x === 'number' ? data.x : 4,
                            y: typeof data.y === 'number' ? data.y : 4
                        };
                    }
                });
                const count = Object.keys(players).length;
                document.getElementById('onlineCount').innerText = `${count} Online`;
            });
        }

        function gridToIso(x, y) {
            const tileW = GameState.tileSize;
            const tileH = GameState.tileSize / 2;
            const offsetX = canvas.width / 2;
            const offsetY = canvas.height / 4;
            return {
                x: (x - y) * (tileW / 2) + offsetX,
                y: (x + y) * (tileH / 2) + offsetY
            };
        }

        function isoToGrid(isoX, isoY) {
            const tileW = GameState.tileSize;
            const tileH = GameState.tileSize / 2;
            const offsetX = canvas.width / 2;
            const offsetY = canvas.height / 4;
            const dx = isoX - offsetX;
            const dy = isoY - offsetY;
            return {
                x: Math.floor((dy / (tileH / 2) + dx / (tileW / 2)) / 2),
                y: Math.floor((dy / (tileH / 2) - dx / (tileW / 2)) / 2)
            };
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Chão
            for (let x = 0; x < GameState.gridSize; x++) {
                for (let y = 0; y < GameState.gridSize; y++) {
                    const pos = gridToIso(x, y);
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y);
                    ctx.lineTo(pos.x + GameState.tileSize / 2, pos.y + GameState.tileSize / 4);
                    ctx.lineTo(pos.x, pos.y + GameState.tileSize / 2);
                    ctx.lineTo(pos.x - GameState.tileSize / 2, pos.y + GameState.tileSize / 4);
                    ctx.closePath();
                    ctx.fillStyle = (x + y) % 2 === 0 ? '#654321' : '#543210';
                    ctx.fill();
                    ctx.strokeStyle = '#3a200a';
                    ctx.stroke();
                }
            }

            // TV
            const tvPos = gridToIso(4, 1);
            ctx.fillStyle = '#111827';
            ctx.fillRect(tvPos.x - 55, tvPos.y - 75, 110, 65);
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.strokeRect(tvPos.x - 55, tvPos.y - 75, 110, 65);

            if (GameState.streamVideo && GameState.streamVideo.readyState === 4) {
                ctx.drawImage(GameState.streamVideo, tvPos.x - 52, tvPos.y - 72, 104, 59);
            } else {
                ctx.fillStyle = '#030712';
                ctx.fillRect(tvPos.x - 52, tvPos.y - 72, 104, 59);
                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 10px sans-serif';
                ctx.fillText('TV QUARTO', tvPos.x - 30, tvPos.y - 38);
            }

            // Jogadores
            Object.values(players).forEach(p => {
                if (p.x === undefined || p.y === undefined) return;
                const pos = gridToIso(p.x, p.y);

                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(pos.x, pos.y + 12, 14, 7, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = p.color || '#10b981';
                ctx.fillRect(pos.x - 8, pos.y - 22, 16, 15);

                ctx.fillStyle = '#fde047';
                ctx.beginPath();
                ctx.arc(pos.x, pos.y - 28, 9, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000000';
                ctx.font = 'bold 11px Ubuntu, sans-serif';
                const nameW = ctx.measureText(p.name || 'Habbo').width;
                ctx.fillRect(pos.x - nameW / 2 - 4, pos.y - 48, nameW + 8, 14);
                ctx.fillStyle = '#ffffff';
                ctx.fillText(p.name || 'Habbo', pos.x - nameW / 2, pos.y - 37);
            });

            requestAnimationFrame(render);
        }

        // VERIFICA SE O USUÁRIO CLICADO É ADMIN PARA MOSTRAR MENU DE KICK
        canvas.addEventListener('click', (e) => {
            if (!currentUser) return;
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            let clickedPlayer = null;

            // Só o Admin pode selecionar outros jogadores
            if (currentUser.email === ADMIN_EMAIL) {
                Object.values(players).forEach(p => {
                    const pos = gridToIso(p.x, p.y);
                    const dist = Math.hypot(clickX - pos.x, clickY - (pos.y - 20));
                    if (dist < 25 && p.id !== currentUser.uid) {
                        clickedPlayer = p;
                    }
                });
            }

            if (clickedPlayer) {
                openContextMenu(clickedPlayer, e.clientX, e.clientY);
            } else {
                closeContextMenu();
                const gridPos = isoToGrid(clickX, clickY);
                if (gridPos.x >= 0 && gridPos.x < GameState.gridSize && gridPos.y >= 0 && gridPos.y < GameState.gridSize) {
                    db.collection('players').doc(currentUser.uid).update({
                        x: gridPos.x,
                        y: gridPos.y
                    });
                }
            }
        });

        function openContextMenu(player, pageX, pageY) {
            selectedTargetPlayerId = player.id;
            const menu = document.getElementById('playerContextMenu');
            document.getElementById('selectedPlayerName').innerText = player.name;
            menu.style.left = `${pageX}px`;
            menu.style.top = `${pageY}px`;
            menu.classList.remove('hidden');
        }

        function closeContextMenu() {
            document.getElementById('playerContextMenu').classList.add('hidden');
            selectedTargetPlayerId = null;
        }

        // APENAS ADMIN EXECUTA O KICK
        async function kickSelectedPlayer() {
            if (!selectedTargetPlayerId || currentUser.email !== ADMIN_EMAIL) return;
            
            try {
                await db.collection('players').doc(selectedTargetPlayerId).update({
                    kicked: true
                });
                
                window.showToast("Jogador expulsar e desconectado!");
                closeContextMenu();
            } catch (err) {
                alert("Erro ao expulsar: " + err.message);
            }
        }

        window.startPCScreenShare = async function() {
            window.toggleWindow('screenShareModal');
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
                const video = document.createElement('video');
                video.srcObject = stream;
                video.muted = true;
                await video.play();

                GameState.streamVideo = video;
                document.getElementById('liveStreamBadge').classList.remove('hidden');
                window.showToast('Transmissão iniciada na TV!');
            } catch (err) {
                alert('Erro na transmissão: ' + err.message);
            }
        };

        window.expandStreamFullScreen = function() {
            if (!GameState.streamVideo) return;
            const fsModal = document.getElementById('fullScreenStreamModal');
            const fsVideo = document.getElementById('fullScreenVideoElement');
            fsVideo.srcObject = GameState.streamVideo.srcObject;
            fsVideo.play();
            fsModal.classList.remove('hidden');

            if (fsModal.requestFullscreen) {
                fsModal.requestFullscreen().catch(err => console.log(err));
            }
        };

        window.closeFullScreenStream = function() {
            document.getElementById('fullScreenStreamModal').classList.add('hidden');
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(err => console.log(err));
            }
        };

        window.toggleWindow = function(id) {
            document.getElementById(id).classList.toggle('hidden');
        };

        window.showToast = function(msg) {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.remove('opacity-0', '-translate-y-20');
            setTimeout(() => toast.classList.add('opacity-0', '-translate-y-20'), 3500);
        };

        window.inviteFriends = function() {
            navigator.clipboard.writeText(window.location.href);
            window.showToast('Link do quarto copiado!');
        };

        render();
    </script>
</body>
</html>
